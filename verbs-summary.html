<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Verbs Summary — le 12 forme verbali italiane spiegate in persiano: formula, coniugazione completa con traduzione فارسی ed esempi.">
  <title>Verbs Summary · خلاصهٔ افعال · Italiano Interattivo</title>
  <link rel="stylesheet" href="assets/styles.css?v=10">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <style>
    /* ── Persian (RTL) prose with Italian (LTR) words inside ── */
    .vs-fa { font-family: var(--font-fa); direction: rtl; text-align: right; line-height: 1.8; font-size: .95rem; }
    .vs-fa bdi.it, td.fa bdi.it { font-family: var(--font-it); font-weight: 600; color: var(--info); }

    /* ── Page title: plain, no banner ── */
    .vs-top { display: flex; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; margin: 2px 0 8px; }
    .vs-top h1 { margin: 0; font-size: 1.35rem; }
    .vs-top h1 .fa { font-size: 1.05rem; color: var(--brand-1); }
    .vs-sub { margin: 0; color: var(--text-mute); font-size: .85rem; }

    /* ── Sticky bar: verb, jump, open/close ── */
    .vs-bar {
      position: sticky; top: var(--header-h); z-index: 30;
      margin: 0 -4px 10px; padding: 8px 4px;
      background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex; gap: 6px; align-items: center;
    }
    .vs-verbs { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; min-width: 0; }
    .vs-verbs::-webkit-scrollbar { display: none; }
    .vs-verbs .chip { white-space: nowrap; display: inline-flex; align-items: baseline; gap: 5px; }
    .vs-verbs .chip .it { font-size: .86rem; }
    .vs-verbs .chip small { font-family: var(--font-fa); font-size: .72rem; opacity: .75; margin: 0; }
    .vs-verbs .chip.irrv::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--brand-4); align-self: center; }
    .vs-verbs .chip.active, .vs-chips .chip.active { background: var(--brand-2); border-color: var(--brand-2); color: #fff; }
    .vs-select {
      min-width: 0; padding: 5px 8px; border-radius: 10px; font-size: .82rem;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
    }
    .vs-select:focus { outline: none; border-color: var(--brand-2); box-shadow: var(--sh-glow); }
    .vs-jump { flex: 0 1 220px; }
    .vs-only-sm { display: none; }
    .vs-all { flex: none; }

    /* ── Form cards ── */
    .vs-form { padding: 0; overflow: hidden; margin-bottom: 8px; scroll-margin-top: calc(var(--header-h) + 56px); }
    .vs-head {
      width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 14px;
      background: none; border: 0; color: inherit; text-align: left;
      transition: background-color 160ms ease;
    }
    @media (hover: hover) and (pointer: fine) { .vs-head:hover { background: var(--surface-2); } }
    .vs-num {
      width: 24px; height: 24px; flex: none; border-radius: 7px; display: grid; place-items: center;
      font-size: .76rem; font-weight: 800; color: var(--brand-5); background: color-mix(in srgb, var(--brand-5) 13%, transparent);
    }
    .vs-titles { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 2px 10px; flex-wrap: wrap; }
    .vs-title-it { font-family: var(--font-it); font-size: 1.02rem; font-weight: 700; }
    .vs-title-fa { font-family: var(--font-fa); font-size: .84rem; color: var(--brand-1); font-weight: 600; }
    .vs-preview {
      font-family: var(--font-it); color: var(--text-mute); font-size: .8rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 38%;
    }
    .vs-head .collapse-caret { font-size: .7rem; margin-left: 2px; }
    .vs-head[aria-expanded="true"] .collapse-caret { transform: rotate(180deg); }
    .vs-body { padding: 0 14px 12px; border-top: 1px solid var(--border); }
    /* Opening is occasional → short quiet entrance; closing is instant. */
    .vs-open-enter-active { transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); }
    .vs-open-enter-from { opacity: 0; transform: translateY(-3px); }

    /* ── Segmented controls (switched often → no animation) ── */
    .vs-seg {
      display: flex; gap: 2px; padding: 2px; margin: 10px 0;
      background: var(--surface-3); border-radius: 9px; overflow-x: auto; scrollbar-width: none;
    }
    .vs-seg::-webkit-scrollbar { display: none; }
    .vs-seg button {
      flex: 1 0 auto; border: 0; background: transparent; color: var(--text-soft);
      padding: 4px 10px; border-radius: 7px; font-weight: 700; font-size: .78rem; white-space: nowrap;
      transition: transform var(--press) var(--ease-out);
    }
    .vs-seg button:active { transform: scale(.97); }
    .vs-seg button[aria-selected="true"], .vs-seg button[aria-checked="true"] { background: var(--surface); color: var(--text); box-shadow: var(--sh-1); }
    .vs-seg button .fa { font-weight: 600; }
    .vs-seg.small { margin: 0; flex: none; }
    .vs-seg.small button { padding: 2px 8px; font-size: .72rem; }

    /* ── Conjugation panel ── */
    .vs-use { margin: 0 0 8px; color: var(--text-soft); }
    .vs-chips { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
    .vs-chips .chip { font-family: var(--font-it); }
    .vs-chips .chip.na { opacity: .55; }
    .vs-tables { display: grid; gap: 10px; }
    .vs-tables > *, .vs-grid > * { min-width: 0; }
    .vs-cap { font-size: .8rem; font-weight: 700; color: var(--text-soft); margin: 0 0 5px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .vs-cap .vs-tools { margin-left: auto; display: flex; gap: 6px; align-items: center; }
    .verb-table th.fa, .verb-table td.fa { text-align: right; font-family: var(--font-fa); }
    .verb-table td.fa { line-height: 1.7; }
    .vs-person { font-size: .84rem; }
    .vs-person small { font-family: var(--font-fa); color: var(--text-mute); font-weight: 600; margin-left: 4px; }
    .vs-person small::before { content: "· "; }
    /* Practice mode: hidden answers, tap to reveal */
    .vs-hide {
      filter: blur(5px); cursor: pointer; user-select: none; border-radius: 5px;
      outline: 1px dashed var(--border-strong); outline-offset: 2px;
      transition: filter 200ms var(--ease-out);
    }
    .vs-note { margin: 8px 0 0; font-size: .88rem; color: var(--info); background: var(--info-bg); border-radius: var(--r-sm); padding: 6px 10px; }
    .vs-na { background: var(--warn-bg); color: var(--warn); border-radius: var(--r-sm); padding: 8px 10px; margin: 0; }

    /* ── Formula panel ── */
    .vs-steps { margin: 4px 0 0; padding-right: 1.2em; }
    .vs-steps li { margin-bottom: 2px; }
    .vs-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); margin-top: 10px; }
    .vs-box { border: 1px solid var(--border); border-radius: var(--r-sm); padding: 8px 10px; background: var(--surface-2); }
    .vs-box.reg { border-left: 3px solid var(--ok); }
    .vs-box.irr { border-left: 3px solid var(--warn); }
    .vs-box .vs-fa { margin: 4px 0 0; font-size: .9rem; }

    /* ── Examples ── */
    .vs-example .ex-it { align-items: center; }
    .vs-example .ex-it em { font-style: normal; flex: none; }
    .vs-example .ex-fa { margin: 3px 0 0; font-size: .92rem; color: var(--text-soft); }
    .vs-example.mine { border-color: var(--brand-2); }
    @media (hover: hover) and (pointer: fine) { .vs-example:hover { transform: none; } }
    .vs-notes { margin: 0; padding-right: 1.2em; }

    /* ── Card footer ── */
    .vs-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border); }

    @media (max-width: 720px) {
      .vs-sub { display: none; }
      .vs-verbs, .vs-all-label { display: none; }
      .vs-only-sm { display: block; flex: 1 1 0; }
      .vs-jump { flex: 1 1 0; }
      .vs-all { width: 32px; justify-content: center; padding: 4px 0; }
      .vs-head { padding: 9px 10px; gap: 8px; }
      .vs-body { padding: 0 10px 10px; }
      .vs-preview { display: none; }
      .verb-table th, .verb-table td { padding: 6px 7px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script>
    window.ITA_LEVEL = 'A2';
    window.ITA_PATHS = { home: 'A2/index.html', levels: 'index.html', base: 'A2/' };
  </script>
  <script src="A2/lessons.js"></script>
  <script src="assets/app.js?v=10"></script>
  <script src="assets/components.js?v=10"></script>
  <!-- Grammar content: every form is written out and checked by
       tools/check-verbs-summary.js (npm test). -->
  <script src="data/verbs-summary.js"></script>

  <script>
  /* ==========================================================================
     Verbs Summary — the 12 Italian verb forms for Persian speakers.
     All content lives in data/verbs-summary.js; this page only renders it.

     Interaction model:
       1. choose a verb once in the sticky bar → every form follows
       2. open a form; inside it, tabs: conjugation · formula · examples · notes
       3. practice mode hides one column; tap a cell to reveal it
     UI choices (verb, open forms, practice mode) are remembered per browser.
     ========================================================================== */
  const SUMMARY = window.VERBS_SUMMARY || { persons: {}, verbs: {}, forms: [], core: [] };
  const { store } = ITA;
  const UI_KEY = 'italiano::verbs-summary::ui';

  /* Runtime guard: a row is shown only if it is well formed. The linguistic
     check (every form recomputed) is done ahead of time by the test script. */
  function validRow(r) {
    return Array.isArray(r) && r.length === 3 && SUMMARY.persons[r[0]] &&
      typeof r[1] === 'string' && r[1].trim() && typeof r[2] === 'string' && r[2].trim();
  }
  SUMMARY.forms.forEach(f => {
    const tables = [].concat(...Object.values(f.verbs).map(v => v.tables || []), f.extra || []);
    tables.forEach(t => {
      const bad = t.rows.filter(r => !validRow(r));
      if (bad.length) console.warn('[verbs-summary] skipped malformed rows in', f.id, bad);
      t.rows = t.rows.filter(validRow);
    });
  });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function loadUi() {
    try { return JSON.parse(localStorage.getItem(UI_KEY)) || {}; } catch (e) { return {}; }
  }

  const PANELS = [
    { key: 'coniug',  it: 'Coniugazione', fa: 'صرف' },
    { key: 'formula', it: 'Formula',      fa: 'فرمول' },
    { key: 'esempi',  it: 'Esempi',       fa: 'مثال' },
    { key: 'note',    it: 'Note',         fa: 'نکته' }
  ];

  ITA.createPage({
    data() {
      const saved = loadUi();
      const open = {}, panel = {};
      SUMMARY.forms.forEach((f, i) => {
        open[f.id] = Array.isArray(saved.open) ? saved.open.includes(f.id) : i === 0;
        panel[f.id] = 'coniug';
      });
      return {
        store,
        forms: SUMMARY.forms,
        verbs: SUMMARY.verbs,
        persons: SUMMARY.persons,
        core: SUMMARY.core,
        panels: PANELS,
        verb: SUMMARY.verbs[saved.verb] ? saved.verb : 'mangiare',
        practice: ['off', 'it', 'fa'].includes(saved.practice) ? saved.practice : 'off',
        revealed: {},
        open, panel,
        jumpTo: ''
      };
    },
    computed: {
      allOpen() { return this.forms.every(f => this.open[f.id]); },
      /** Core verbs, plus the current one if it is an extra (invitare). */
      barVerbs() { return this.core.includes(this.verb) ? this.core : this.core.concat(this.verb); }
    },
    watch: {
      verb: 'saveUi',
      practice() { this.revealed = {}; this.saveUi(); },
      open: { handler: 'saveUi', deep: true }
    },
    methods: {
      saveUi() {
        try {
          localStorage.setItem(UI_KEY, JSON.stringify({
            verb: this.verb, practice: this.practice,
            open: this.forms.filter(f => this.open[f.id]).map(f => f.id)
          }));
        } catch (e) { /* storage blocked → the page still works, it just won't remember */ }
      },
      /** Persian prose with *italian* spans isolated as LTR runs. */
      rich(s) {
        return escapeHtml(s || '').replace(/\*([^*]+)\*/g, '<bdi class="it" lang="it" dir="ltr">$1</bdi>');
      },

      /* --- which verb a card shows --- */
      /** The chosen verb if this form has it, otherwise its first verb with tables. */
      eff(f) {
        if (f.verbs[this.verb]) return this.verb;
        return Object.keys(f.verbs).find(v => !f.verbs[v].na);
      },
      entry(f) { return f.verbs[this.eff(f)] || {}; },
      /** Forms whose verb list differs from the bar (passive: + invitare, − andare/dormire). */
      ownVerbs(f) { return Object.keys(f.verbs).some(v => !this.core.includes(v)); },
      preview(f) {
        const e = this.entry(f);
        if (e.na) return '—';
        const t = e.tables && e.tables[e.tables.length > 1 && e.tables[0].rows.length < 2 ? 1 : 0];
        if (!t || !t.rows.length) return '';
        return t.rows.slice(0, 2).map(r => r[1]).join(' · ') + (t.rows.length > 2 ? ' …' : '');
      },
      examplesFor(f) {
        // The chosen verb's sentences first, so the most relevant one is on top.
        const v = this.eff(f);
        return f.examples.slice().sort((a, b) => (b.verb === v) - (a.verb === v));
      },
      pick(inf) { this.verb = inf; },

      /* --- opening, jumping --- */
      toggle(id) { this.open[id] = !this.open[id]; },
      setAll(v) { this.forms.forEach(f => { this.open[f.id] = v; }); },
      jump(id) {
        const f = this.forms.find(x => x.id === id);
        if (!f) return;
        this.open[f.id] = true;
        this.$nextTick(() => {
          const el = document.getElementById(f.id);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          history.replaceState(null, '', '#' + f.id);
        });
      },
      onJump() { this.jump(this.jumpTo); this.jumpTo = ''; },
      go(from, to) { this.open[from.id] = false; this.jump(to.id); },
      prevForm(f) { return this.forms[this.forms.indexOf(f) - 1] || null; },
      nextForm(f) { return this.forms[this.forms.indexOf(f) + 1] || null; },

      /** Arrow keys move between the buttons of a tab list / radio group. */
      arrows(e) {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        const btns = [...e.currentTarget.querySelectorAll('button')];
        const i = btns.indexOf(document.activeElement);
        if (i < 0) return;
        e.preventDefault();
        const n = btns[(i + (e.key === 'ArrowRight' ? 1 : -1) + btns.length) % btns.length];
        n.focus(); n.click();
      },

      /* --- tables & practice mode --- */
      isIrr(t, p) { return Array.isArray(t.irr) && t.irr.indexOf(p) >= 0; },
      cellKey(f, ti, p, col) { return f.id + '|' + this.eff(f) + '|' + ti + '|' + p + '|' + col; },
      hidden(f, ti, p, col) { return this.practice === col && !this.revealed[this.cellKey(f, ti, p, col)]; },
      reveal(f, ti, p, col) { this.revealed[this.cellKey(f, ti, p, col)] = true; },

      /** Text for speech synthesis: drops agreement slashes (andato/a → andato). */
      say(text) {
        ITA.speak(text.replace(/\s\/\s/g, ', ').replace(/\/[a-zàèéìòù]+/gi, '').replace(/!/g, ''));
      },
      sayTable(t) { this.say(t.rows.map(r => r[1]).join(', ')); }
    },
    mounted() {
      const id = location.hash.slice(1);
      if (this.forms.some(x => x.id === id)) this.jump(id);
    },
    template: `
      <a class="skip-link" href="#main">Vai al contenuto</a>
      <site-header current="verbs-summary.html"></site-header>

      <main id="main" class="container">
        <header class="vs-top">
          <h1>Verbs Summary <span class="fa" lang="fa">· خلاصهٔ افعال</span></h1>
          <p class="vs-sub fa" lang="fa">۱۲ زمان و وجه · فعل را انتخاب کنید، یک زمان را باز کنید، با «تمرین» خودتان را بسنجید.</p>
        </header>

        <!-- Sticky bar: the one place to choose the verb -->
        <div class="vs-bar">
          <div class="vs-verbs" role="radiogroup" aria-label="Verbo · فعل" @keydown="arrows">
            <button v-for="inf in barVerbs" :key="inf" class="chip" role="radio"
                    :class="{ active: verb === inf, irrv: !verbs[inf].regular }" :aria-checked="String(verb === inf)"
                    :tabindex="verb === inf ? 0 : -1" :title="verbs[inf].regular ? 'regolare · باقاعده' : 'irregolare · بی‌قاعده'"
                    @click="pick(inf)">
              <span class="it" lang="it">{{ inf }}</span><small lang="fa">{{ verbs[inf].fa }}</small>
            </button>
          </div>
          <select class="vs-select vs-only-sm" v-model="verb" aria-label="Verbo · فعل">
            <option v-for="inf in barVerbs" :key="inf" :value="inf">{{ inf }} — {{ verbs[inf].fa }}</option>
          </select>
          <select class="vs-select vs-jump" v-model="jumpTo" @change="onJump" aria-label="Vai a una forma verbale">
            <option value="" disabled>Vai a… · رفتن به…</option>
            <option v-for="f in forms" :key="f.id" :value="f.id">{{ f.num }} · {{ f.it }} — {{ f.fa }}</option>
          </select>
          <button class="btn btn-ghost btn-sm vs-all" @click="setAll(!allOpen)" :aria-pressed="String(allOpen)"
                  :aria-label="allOpen ? 'Chiudi tutto · بستن همه' : 'Apri tutto · باز کردن همه'">
            <span aria-hidden="true">{{ allOpen ? '▴' : '▾' }}</span>
            <span class="vs-all-label">{{ allOpen ? 'Chiudi tutto' : 'Apri tutto' }}</span>
          </button>
        </div>

        <!-- One card per verb form -->
        <section v-for="f in forms" :key="f.id" :id="f.id" class="card vs-form">
          <h2 style="margin:0"><button class="vs-head" :aria-expanded="String(!!open[f.id])" :aria-controls="f.id + '-body'" @click="toggle(f.id)">
            <span class="vs-num" aria-hidden="true">{{ f.num }}</span>
            <span class="vs-titles">
              <span class="vs-title-it" lang="it">{{ f.it }}</span>
              <span class="vs-title-fa" lang="fa" dir="rtl">{{ f.fa }}</span>
            </span>
            <span class="vs-preview" lang="it" :title="preview(f)">{{ preview(f) }}</span>
            <span class="collapse-caret" aria-hidden="true">▼</span>
          </button></h2>

          <transition name="vs-open">
            <div v-show="open[f.id]" :id="f.id + '-body'" class="vs-body">
              <div class="vs-seg" role="tablist" :aria-label="f.it" @keydown="arrows">
                <button v-for="p in panels" :key="p.key" role="tab" :id="f.id + '-tab-' + p.key"
                        :aria-selected="String(panel[f.id] === p.key)" :aria-controls="f.id + '-panel'"
                        :tabindex="panel[f.id] === p.key ? 0 : -1" @click="panel[f.id] = p.key">
                  {{ p.it }} · <span class="fa" lang="fa">{{ p.fa }}</span>
                </button>
              </div>

              <div :id="f.id + '-panel'" role="tabpanel" :aria-labelledby="f.id + '-tab-' + panel[f.id]">

                <!-- ── Coniugazione ── -->
                <template v-if="panel[f.id] === 'coniug'">
                  <p class="vs-fa vs-use" lang="fa" dir="rtl" v-html="rich(f.use)"></p>

                  <!-- Only the passive forms have their own verb list -->
                  <div v-if="ownVerbs(f)" class="vs-chips" role="radiogroup" :aria-label="'Verbo per ' + f.it" @keydown="arrows">
                    <button v-for="inf in Object.keys(f.verbs)" :key="inf" class="chip" role="radio" lang="it"
                            :class="{ active: eff(f) === inf, na: f.verbs[inf].na }"
                            :aria-checked="String(eff(f) === inf)" :tabindex="eff(f) === inf ? 0 : -1"
                            @click="pick(inf)">{{ inf }}<small v-if="f.verbs[inf].na"> n/a</small></button>
                  </div>
                  <p v-if="eff(f) !== verb" class="vs-note vs-fa" lang="fa" dir="rtl" style="margin:0 0 8px"
                     v-html="rich('*' + verb + '* در این بخش نیست؛ جدول *' + eff(f) + '* نمایش داده می‌شود.')"></p>

                  <p v-if="entry(f).na" class="vs-na vs-fa" lang="fa" dir="rtl" v-html="rich(entry(f).na)"></p>

                  <template v-else>
                    <div class="vs-tables">
                      <div v-for="(t, ti) in entry(f).tables" :key="eff(f) + ti">
                        <div class="vs-cap">
                          <span>{{ t.title || f.it }} · <span class="it" lang="it">{{ eff(f) }}</span></span>
                          <template v-if="ti === 0">
                            <span class="pill" :class="verbs[eff(f)].regular ? 'pill-ok' : 'pill-warn'">{{ verbs[eff(f)].regular ? 'regolare · باقاعده' : 'irregolare · بی‌قاعده' }}</span>
                            <span class="pill pill-info" lang="it">{{ verbs[eff(f)].aux }}</span>
                          </template>
                          <span class="vs-tools">
                            <span v-if="ti === 0" class="vs-seg small" role="radiogroup" aria-label="Esercizio · تمرین" @keydown="arrows">
                              <button role="radio" :aria-checked="String(practice === 'off')" @click="practice = 'off'" title="Mostra tutto · نمایش همه">Tutto</button>
                              <button role="radio" :aria-checked="String(practice === 'it')" @click="practice = 'it'" title="Nascondi l'italiano · مخفی کردن ایتالیایی">— IT</button>
                              <button role="radio" :aria-checked="String(practice === 'fa')" @click="practice = 'fa'" title="Nascondi il persiano · مخفی کردن فارسی">— <span class="fa" lang="fa">فا</span></button>
                            </span>
                            <button class="mini-btn" @click="sayTable(t)" :aria-label="'Ascolta ' + (t.title || f.it)">🔊</button>
                          </span>
                        </div>
                        <div class="table-wrap">
                          <table class="verb-table">
                            <thead><tr><th>Persona · شخص</th><th>Italiano</th><th class="fa" lang="fa">فارسی</th></tr></thead>
                            <tbody>
                              <tr v-for="r in t.rows" :key="r[0]">
                                <td class="vs-person"><span lang="it">{{ persons[r[0]].it }}</span><small lang="fa">{{ persons[r[0]].fa }}</small></td>
                                <td>
                                  <span class="form" lang="it"
                                        :class="{ irr: isIrr(t, r[0]), 'vs-hide': hidden(f, ti, r[0], 'it') }"
                                        :role="hidden(f, ti, r[0], 'it') ? 'button' : null"
                                        :tabindex="hidden(f, ti, r[0], 'it') ? 0 : null"
                                        :aria-label="hidden(f, ti, r[0], 'it') ? 'Mostra la risposta' : null"
                                        @click="reveal(f, ti, r[0], 'it')" @keydown.enter="reveal(f, ti, r[0], 'it')">{{ r[1] }}</span>
                                </td>
                                <td class="fa" lang="fa" dir="rtl">
                                  <span :class="{ 'vs-hide': hidden(f, ti, r[0], 'fa') }"
                                        :role="hidden(f, ti, r[0], 'fa') ? 'button' : null"
                                        :tabindex="hidden(f, ti, r[0], 'fa') ? 0 : null"
                                        :aria-label="hidden(f, ti, r[0], 'fa') ? 'نمایش جواب' : null"
                                        @click="reveal(f, ti, r[0], 'fa')" @keydown.enter="reveal(f, ti, r[0], 'fa')">{{ r[2] }}</span>
                                </td>
                              </tr>
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                    <p v-if="entry(f).note" class="vs-note vs-fa" lang="fa" dir="rtl" v-html="rich(entry(f).note)"></p>
                  </template>

                  <!-- Reference tables (e.g. essere / avere) -->
                  <div v-if="f.extra && f.extra.length" class="vs-grid">
                    <div v-for="(t, ti) in f.extra" :key="ti">
                      <p class="vs-cap">{{ t.title }}</p>
                      <div class="table-wrap">
                        <table class="verb-table">
                          <tbody>
                            <tr v-for="r in t.rows" :key="r[0]">
                              <td class="vs-person"><span lang="it">{{ persons[r[0]].it }}</span><small lang="fa">{{ persons[r[0]].fa }}</small></td>
                              <td><span class="form" :class="{ irr: isIrr(t, r[0]) }" lang="it">{{ r[1] }}</span></td>
                              <td class="fa" lang="fa" dir="rtl">{{ r[2] }}</td>
                            </tr>
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                </template>

                <!-- ── Formula ── -->
                <template v-else-if="panel[f.id] === 'formula'">
                  <syntax-box label="Formula · فرمول" :rows="[{ parts: f.formula.parts, example: f.formula.example }]"></syntax-box>
                  <p class="vs-fa" lang="fa" dir="rtl" style="font-weight:700;margin:0" v-html="rich(f.formula.fa)"></p>
                  <ol class="vs-fa vs-steps" lang="fa" dir="rtl">
                    <li v-for="(s, i) in f.formula.steps" :key="i" v-html="rich(s)"></li>
                  </ol>
                  <div class="vs-grid">
                    <div class="vs-box reg">
                      <span class="pill pill-ok">regolari · باقاعده</span>
                      <p class="vs-fa" lang="fa" dir="rtl" v-html="rich(f.regular)"></p>
                    </div>
                    <div class="vs-box irr">
                      <span class="pill pill-warn">irregolari · بی‌قاعده</span>
                      <p class="vs-fa" lang="fa" dir="rtl" v-html="rich(f.irregular)"></p>
                    </div>
                  </div>
                  <div class="vs-grid">
                    <div v-for="(e, ei) in f.endings" :key="ei">
                      <p class="vs-cap">{{ e.title }}</p>
                      <div class="table-wrap">
                        <table class="verb-table">
                          <thead><tr><th></th><th v-for="c in e.cols" :key="c" lang="it">{{ c }}</th></tr></thead>
                          <tbody>
                            <tr v-for="r in e.rows" :key="r[0]">
                              <td class="vs-person"><span lang="it">{{ persons[r[0]].it }}</span><small lang="fa">{{ persons[r[0]].fa }}</small></td>
                              <td v-for="(c, ci) in r.slice(1)" :key="ci"><span class="form" lang="it">{{ c }}</span></td>
                            </tr>
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                </template>

                <!-- ── Esempi ── -->
                <template v-else-if="panel[f.id] === 'esempi'">
                  <div v-for="(e, ei) in examplesFor(f)" :key="ei" class="example-card vs-example" :class="{ mine: e.verb === eff(f) }">
                    <div class="ex-it" lang="it" dir="ltr">
                      <em class="pill" :class="{ 'pill-info': e.verb === eff(f) }">{{ e.verb }}</em>
                      <span>{{ e.it }}</span>
                      <span class="ex-tools">
                        <speak-btn :text="e.it"></speak-btn>
                        <copy-btn :text="e.it"></copy-btn>
                      </span>
                    </div>
                    <p class="ex-fa vs-fa" lang="fa" dir="rtl">{{ e.fa }}</p>
                  </div>
                </template>

                <!-- ── Note ── -->
                <template v-else>
                  <ul class="vs-fa vs-notes" lang="fa" dir="rtl">
                    <li v-for="(n, ni) in f.notes" :key="ni" v-html="rich(n)"></li>
                  </ul>
                  <p class="vs-note vs-fa" lang="fa" dir="rtl">
                    <bdi class="it" lang="it">{{ eff(f) }}</bdi> — <span v-html="rich(verbs[eff(f)].noteFa)"></span>
                  </p>
                </template>
              </div>

              <div class="vs-foot">
                <button v-if="prevForm(f)" class="btn btn-ghost btn-sm" @click="go(f, prevForm(f))">
                  ← <span lang="it">{{ prevForm(f).it }}</span>
                </button>
                <span v-else></span>
                <button v-if="nextForm(f)" class="btn btn-primary btn-sm" @click="go(f, nextForm(f))">
                  <span lang="it">{{ nextForm(f).it }}</span> →
                </button>
              </div>
            </div>
          </transition>
        </section>
      </main>

      <footer class="site-footer">
        <p>Verbs Summary · خلاصهٔ افعال · Italiano Interattivo</p>
      </footer>
      <toast-host></toast-host>
    `
  });
  </script>
</body>
</html>
