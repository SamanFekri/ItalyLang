      formula: 'Soggetto + [avevo/avevi/aveva/avevamo/avevate/avevano] oppure [ero/eri/era/eravamo/eravate/erano] + PARTICIPIO PASSATO',
      rules: [
        'Il trapassato prossimo = passato prossimo con l\'ausiliare all\'imperfetto.',
        'L\'ausiliare è lo stesso del passato prossimo: se "sono andato", allora "ero andato".',
        'Con essere il participio concorda col soggetto; con avere resta in -o (salvo pronome oggetto diretto prima del verbo).',
        'Serve per indicare un fatto anteriore a un altro fatto passato: «Quando sono arrivato, era già partito».',
        'Parole-segnale: già, appena, non… ancora, non… mai, dopo che, prima, il giorno precedente.',
        'Gli avverbi brevi vanno tra ausiliare e participio: avevo già finito.',
