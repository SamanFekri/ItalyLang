        { speaker: 'Giulia', icon: '👩', it: 'Che bello! Io sono di Napoli. Sei stanco oggi?', en: 'How nice! I\'m from Naples. Are you tired today?',

        { speaker: 'Saman', icon: '🧑', side: 'right', it: 'Un po\'. Ho sonno, ieri sono stato in ufficio fino a tardi.', en: 'A bit. I\'m sleepy — yesterday I was at the office until late.',

      formula: 'Soggetto + essere (sono / sei / è / siamo / siete / sono) + aggettivo o nome che CONCORDA',
      rules: [
        'Presente irregolare: sono, sei, è, siamo, siete, sono.',
        'L\'aggettivo dopo essere concorda in genere e numero: alto / alta / alti / alte.',
        'Passato prossimo: essere + stato/stata/stati/state (il participio concorda col soggetto).',
        'Esistenza: c\'è + singolare, ci sono + plurale.',
